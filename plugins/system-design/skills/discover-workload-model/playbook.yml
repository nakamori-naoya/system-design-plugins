# discover-workload-model — 上流資料と観測値から利用負荷モデル資料（workload-model型のMarkdown）を1本作る。
# 工程順と入出力だけを持つ。判断規律はSKILL.mdとreferencesが持つ。対話の作法はgrillの公開契約が持つ。
# 本文はagentがインメモリで保持し、検査scriptへは標準入力で渡す。JSONも一時fileも作らず、保存はwrite-docが行う。
version: 2
name: discover-workload-model
description: 上流成果物と観測値から、採用する仮定を要件と構成判断へ接続した利用負荷モデル資料（Markdown）を同じagentが宣言順に作る。
inputs: [request, references, requirements_document_path, journey_or_domain_artifacts, document_destination]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}
steps:
  - id: fix-upstream-identity
    agent_work: invoking_agent
    purpose: "依頼、referencesの資料、要求発見資料、ユーザージャーニー・ドメイン成果物を読み、上流成果物と対象の同一性を固定する"
    needs: [request, references, requirements_document_path, journey_or_domain_artifacts]
  - id: separate-claims-and-states
    agent_work: invoking_agent
    purpose: "数値根拠主張と状態を分ける"
  - id: attach-measurement-context
    agent_work: invoking_agent
    purpose: "すべての数値へ測定文脈を付け、無ければ推定を仮説として管理する"
  - id: separate-average-peak-burst
    agent_work: invoking_agent
    purpose: "平均、ピーク、突発を別々に扱う"
  - id: record-ratios-volume-retention-growth
    agent_work: invoking_agent
    purpose: "比率、データ量、保持、成長を記録する"
  - id: record-distribution-and-hotspots
    agent_work: invoking_agent
    purpose: "偏りが操作頻度型か影響範囲型かを分け、分布、配信先数、集中キーを負荷特性として記録する"
  - id: attach-sensitivity-and-verification
    agent_work: invoking_agent
    purpose: "設計感度と検証計画を付ける"
  - id: connect-assumptions-to-design
    agent_work: invoking_agent
    purpose: "採用仮定を要件と構成判断へ接続し、設計入力として閉じる"
  - id: settle
    playbook: grill
    purpose: "手順1〜8で残った未決のうち、答えで母集団・到着率・保持・偏り・設計入力の接続が変わる問いを成果を左右する順に推奨（フェルミ推定の桁を含む）付きでquestionsへ渡し、grillの公開契約に従って利用者と解消し、決定と未決（推奨付き）を受け取る"
    needs: [request, references]
    provides: [decisions, open_questions]
  - id: compose-document-text
    agent_work: invoking_agent
    purpose: "決定と未決を根拠状態を保って反映し、既存資料の体裁またはtemplateの論点を使い、結論と採用値を先に置いた自然な本文を組み立てる"
    needs: [decisions, open_questions]
    provides: [workload_document_text]
  - id: verify
    script: scripts/workload.py
    purpose: "本文を標準入力、要求発見資料を--upstreamで受け、読み手向けMarkdownの構造と上流資料を読めることを検査し、statusと本文にある追跡ID一覧を返す"
    needs: [workload_document_text, requirements_document_path]
    provides: [verification_result]
  - id: save-markdown-canonical
    playbook: write-doc
    purpose: "同じagentが検査済み本文をkind: textのmaterialにし、document_destinationの保存先と入力のreferencesをそのまま渡してworkload-model型の資料を1本保存する"
    input:
      document_type: workload-model
    needs: [workload_document_text, verification_result, document_destination, references]
    provides: [workload_document_path]
  - id: read-back-document
    agent_work: invoking_agent
    purpose: "保存した資料を読み戻し、検査した本文と同じID、数値、根拠状態、未決、statusを保っていることを確かめる"
    needs: [workload_document_path, verification_result]
