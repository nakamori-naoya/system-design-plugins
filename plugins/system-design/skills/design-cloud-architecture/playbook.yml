# design-cloud-architecture — 上流資料と入力providerからクラウドアーキテクチャ資料（cloud-architecture型のMarkdown）を1本作る。
# 工程順と入出力だけを持つ。判断規律はSKILL.mdとreferencesが持つ。対話の作法はgrillの公開契約が持つ。
# 本文はagentがインメモリで保持し、検査scriptへは標準入力で渡す。JSONも一時fileも作らず、保存はwrite-docが行う。
version: 2
name: design-cloud-architecture
description: 要求・負荷・品質・制約と入力providerから、選定・代替案・ADR・障害経路・編集可能な図・追跡を持つクラウドアーキテクチャ資料（Markdown）を同じagentが宣言順に作る。
inputs: [request, references, provider, requirements_document_path, logical_design, workload_document_path, quality_document_path, organizational_constraints, document_destination]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}
steps:
  - id: fix-upstream-evidence
    agent_work: invoking_agent
    purpose: "依頼、referencesの資料、上流資料、論理設計、制約を読み、入力providerの根拠制約（CON-、agreed_decision）と設計根拠を固定する"
    needs: [request, references, provider, requirements_document_path, logical_design, workload_document_path, quality_document_path, organizational_constraints]
  - id: decide-deployment-boundary
    agent_work: invoking_agent
    purpose: "配置方式の境界を判定する"
  - id: compare-alternatives
    agent_work: invoking_agent
    purpose: "構成を左右する選定ごとに代替案を比較する"
  - id: record-adrs
    agent_work: invoking_agent
    purpose: "採用判断をADRへ固定する"
  - id: design-failure-paths
    agent_work: invoking_agent
    purpose: "障害・縮退経路を設計する"
  - id: draw-editable-infrastructure
    agent_work: invoking_agent
    purpose: "編集可能なインフラ構成図を作る"
  - id: close-trace-and-verification
    agent_work: invoking_agent
    purpose: "追跡の表と検証を閉じる"
  - id: settle
    playbook: grill
    purpose: "手順1〜7で残った未決のうち、答えで配置方式・選定・ADRの採否・障害時の挙動が変わる問いを成果を左右する順に推奨付きでquestionsへ渡し、grillの公開契約に従って利用者と解消し、決定と未決（推奨付き）を受け取る"
    needs: [request, references]
    provides: [decisions, open_questions]
  - id: compose-document-text
    agent_work: invoking_agent
    purpose: "決定を本文へ反映し、未決は推奨を仮置きした hypothesis / open_question（選定は未決、ADRは hypothesis のまま）として追跡の表と本文へ書き、write-docの公開契約「検査が読む目印」に従って本文をインメモリで組み立てる"
    needs: [decisions, open_questions]
    provides: [architecture_document_text]
  - id: verify
    script: scripts/architecture.py
    purpose: "本文を標準入力、上流3資料を--upstreamで受け、冒頭、追跡の表のIDの一意性とIDの種別ごとの状態、根拠IDの到達、agreed_decisionのCON、flowchartに全NODEが現れることを述語として検査し、statusとID一覧を返す"
    needs: [architecture_document_text, requirements_document_path, workload_document_path, quality_document_path]
    provides: [verification_result]
  - id: save-markdown-canonical
    playbook: write-doc
    purpose: "同じagentが検査済み本文をkind: textのmaterialにし、document_destinationの保存先と入力のreferencesをそのまま渡してcloud-architecture型の資料を1本保存する"
    input:
      document_type: cloud-architecture
    needs: [architecture_document_text, verification_result, document_destination, references]
    provides: [architecture_document_path]
  - id: read-back-document
    agent_work: invoking_agent
    purpose: "保存した資料を読み戻し、検査した本文と同じID、状態、ADR、図、未決、statusを保っていることと、採用した構成が入力providerで組まれていることを確かめる"
    needs: [architecture_document_path, verification_result, provider]
