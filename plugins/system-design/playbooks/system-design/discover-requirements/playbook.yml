version: 2
name: discover-requirements
description: 要求源から要求発見正本を作る独立プレイブック
instructions:
  execution:
    directive: 対応する一責務スキルだけを実行し、設計へ飛躍しない
focus: requirements-discovery
document_type: requirements-discovery
output_format: markdown
requires:
  - {plugin: discover-requirements, marketplace: system-design}
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}
contract:
  document_destination:
    new: [output_directory]
    update: [update_target]
    exclusive: true
  document:
    contract: write-doc/write-doc
    version: 2
    new_name: requirements-discovery.md
    result: [status, path, reason]
  grounding_sources: [request, referenced_artifacts, decisions, open_questions]
  confidence: [confirmed, assumed, unknown]
  excluded_concerns: [journey, domain, data_model, cloud_architecture]
  cleanup:
    delete_after_document: [cleanup_manifest, grill_input, grill_output, grounded_input, requirements_artifact, material, verification_report]
    preserve: [referenced_artifacts, requirements_document_path]
  outcome:
    status: ${verification_report.status}
    open_questions: ${verification_report.open_questions}
    handoff: ${verification_report.handoff}
    document_path: ${requirements_document_path}
steps:
  - {id: plan-cleanup, script: scripts/plan-cleanup.py, purpose: この実行が所有する一時成果物だけを後片付け対象として宣言する, needs: [run_root], provides: [cleanup_manifest]}
  - {id: settle, playbook: grill, purpose: 入力だけでは決まらない目的・境界・制約を1問ずつ推奨付きで確かめる, needs: [run_root, request, referenced_artifacts], provides: [decisions, open_questions]}
  - {id: ground, script: scripts/ground.py, purpose: 依頼・資料・決定・未決を根拠状態付き入力へ束ねる, needs: [request, referenced_artifacts, decisions, open_questions], provides: [grounded_input]}
  - {id: discover, skill: discover-requirements, purpose: 仮説を昇格させず要求発見正本を作る, needs: [grounded_input], provides: [requirements_artifact]}
  - {id: material, script: scripts/material.py, purpose: 要求正本と根拠を日本語Markdown素材へ束ねる, needs: [grounded_input, requirements_artifact], provides: [material]}
  - {id: verify, script: scripts/verify.py, purpose: 未決保持・根拠追跡・日本語素材を検査する, needs: [grounded_input, material, open_questions], provides: [verification_report]}
  - {id: document, playbook: write-doc, purpose: readyとunresolvedの双方で状態を含む要求発見正本を日本語Markdownで1本保存する, input: {document_type: requirements-discovery, material: [{kind: file, path: '${material}'}]}, needs: [material, verification_report, document_destination], provides: [requirements_document_path]}
  - {id: cleanup, script: scripts/cleanup.py, purpose: 存在する範囲で自分が所有する一時成果物だけを成功時・失敗時に削除する, needs: [cleanup_manifest], provides: [cleanup_report], always_run: true}
