version: 2
name: discover-workload-model
description: 利用行為と負荷特性から利用・負荷モデル正本を作る独立プレイブック
instructions:
  execution:
    directive: 対応する一責務スキルだけを実行し、SLOや技術方式を決めない
focus: workload-discovery
document_type: workload-model
output_format: markdown
out_dir: system-design/workloads
requires:
  - {plugin: discover-workload-model, marketplace: system-design}
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}
contract:
  grounding_sources: [request, requirements_baseline, journey_or_domain_artifacts, decisions, open_questions]
  confidence: [confirmed, assumed, unknown]
  excluded_concerns: [slo, data_model, cloud_architecture]
  cleanup:
    delete_after_document: [cleanup_manifest, grounded_input, workload_artifact, material, verification_report, write_doc_config]
    preserve: [referenced_artifacts, workload_document_path]
  outcome:
    status: ${verification_report.status}
    open_questions: ${verification_report.open_questions}
    handoff: ${verification_report.handoff}
    document_path: ${workload_document_path}
steps:
  - {id: plan-cleanup, script: scripts/plan-cleanup.py, purpose: この実行が所有する一時成果物だけを後片付け対象として宣言する, needs: [run_root], provides: [cleanup_manifest]}
  - {id: settle, playbook: grill, purpose: 入力だけでは決まらない負荷仮説を1問ずつ推奨付きで確かめる, needs: [request, referenced_artifacts], provides: [decisions, open_questions]}
  - {id: ground, script: scripts/ground.py, purpose: 依頼・資料・決定・未決を根拠状態付き入力へ束ねる, needs: [request, referenced_artifacts, decisions, open_questions], provides: [grounded_input]}
  - {id: discover, skill: discover-workload-model, purpose: 分布・偏り・ピーク・増加を持つ利用負荷正本を作る, needs: [grounded_input], provides: [workload_artifact]}
  - {id: material, script: scripts/material.py, purpose: 利用負荷正本と根拠を日本語Markdown素材へ束ねる, needs: [grounded_input, workload_artifact], provides: [material]}
  - {id: verify, script: scripts/verify.py, purpose: 単位・時間窓・母集団・未決保持・日本語素材を検査する, needs: [grounded_input, material, open_questions], provides: [verification_report]}
  - {id: document, playbook: write-doc, purpose: readyとunresolvedの双方で状態を含む利用負荷モデル正本を日本語Markdownで1本保存する, input: {document_type: workload-model, name: workload-model.md}, needs: [material, verification_report], provides: [workload_document_path, write_doc_config]}
  - {id: cleanup, script: scripts/cleanup.py, purpose: 存在する範囲で自分が所有する一時成果物とwrite-doc設定だけを成功時・失敗時に削除する, needs: [cleanup_manifest], provides: [cleanup_report], always_run: true}
